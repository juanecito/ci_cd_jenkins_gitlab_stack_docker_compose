# Shared settings, merged into services with `<<: *name`. A merge is shallow: a
# service that sets its own `environment:` must merge the shared one inside it.

# Every long-running service: restart policy and the shared network
x-service: &service
  restart: unless-stopped
  networks:
    - ci_net

x-tz-env: &tz-env
  TZ: "${TZ:-UTC}"

x-runner-image: &runner-image gitlab/gitlab-runner:latest

# C/C++ Jenkins agents: one image per Debian release, built from
# agent_jenkins_cpp_<release>/ plus the shared agent_jenkins_common/ context
x-cpp-agent-build: &cpp-agent-build
  additional_contexts:
    common: ./agent_jenkins_common
  args:
    AGENT_UID: 1002
    AGENT_GID: 1002

x-cpp-agent-env: &cpp-agent-env
  <<: *tz-env
  JENKINS_URL: http://jenkins:8080
  JENKINS_AGENT_WORKDIR: /home/jenkins/agent
  JAVA_OPTS: -Xmx512m

x-cpp-agent: &cpp-agent
  <<: *service
  init: true   # tini as PID 1: reaps zombie build processes and forwards signals
  depends_on: [jenkins]
  group_add:
    - "${DOCKER_GID}"   # GID of the host Docker socket, so the agent can run docker

services:
  gitlab:
    <<: *service
    image: gitlab/gitlab-ce:latest
    container_name: gitlab
    hostname: gitlab.local
    shm_size: "256m"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
        gitlab_rails['initial_root_password'] = '${GITLAB_ROOT_PASSWORD}'
        # Reduce memory usage on small hosts
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 10
        prometheus_monitoring['enable'] = false
    ports:
      - "127.0.0.1:8929:8929"   # HTTP
      - "127.0.0.1:8443:443"    # HTTPS
      - "127.0.0.1:2224:22"     # SSH
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab
    healthcheck:
      test: ["CMD", "/opt/gitlab/bin/gitlab-healthcheck", "--fail", "--max-time", "10"]
      interval: 60s
      timeout: 30s
      retries: 5
      start_period: 5m

  jenkins:
    <<: *service
    image: jenkins/jenkins:latest
    container_name: jenkins
    user: root
    environment:
      <<: *tz-env
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true -Xmx1g"
      JENKINS_OPTS: "--httpPort=8080"
    ports:
      - "127.0.0.1:8080:8080"     # Web UI
      - "127.0.0.1:50000:50000"   # Inbound agents
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock   # allow builds to use host Docker
    depends_on:
      gitlab:
        condition: service_started

  gitlab-runner:
    <<: *service
    image: *runner-image
    container_name: gitlab-runner
    environment:
      <<: *tz-env
    volumes:
      - gitlab_runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock   # docker executor starts job containers on the host
    depends_on:
      gitlab:
        condition: service_healthy
      gitlab-runner-register:
        condition: service_completed_successfully

  # One-shot job: creates an instance runner via the GitLab API and registers it
  # in gitlab_runner_config. Does nothing if a runner is already registered.
  gitlab-runner-register:
    <<: *service
    image: *runner-image
    container_name: gitlab-runner-register
    restart: "no"
    entrypoint: ["/bin/bash", "/register.sh"]
    environment:
      GITLAB_URL: http://gitlab:8929
      RUNNER_NAME: "${RUNNER_NAME:-docker-runner}"
      RUNNER_TAGS: "${RUNNER_TAGS:-docker}"
      RUNNER_DEFAULT_IMAGE: "${RUNNER_DEFAULT_IMAGE:-alpine:latest}"
      RUNNER_CONCURRENT: "${RUNNER_CONCURRENT:-2}"
      RUNNER_MOUNT_DOCKER_SOCK: "${RUNNER_MOUNT_DOCKER_SOCK:-false}"
      RUNNER_NETWORK: ci_net
    volumes:
      - ./runner/register.sh:/register.sh:ro
      - gitlab_runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock   # used to run `gitlab-rails runner` inside the gitlab container and mint a bootstrap API token (GitLab dropped OAuth password-grant login)
    depends_on:
      gitlab:
        condition: service_healthy

  sonarqube_db:
    <<: *service
    image: postgres:16
    container_name: sonarqube_db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD}"
      POSTGRES_DB: sonarqube
    volumes:
      - gitlab_sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 5

  sonarqube:
    <<: *service
    image: sonarqube:community
    container_name: sonarqube
    depends_on:
      sonarqube_db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD}"
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - gitlab_sonarqube_data:/opt/sonarqube/data
      - gitlab_sonarqube_extensions:/opt/sonarqube/extensions
      - gitlab_sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072

  registry:
    <<: *service
    image: registry:latest
    container_name: registry
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_data:/var/lib/registry

  agent_jenkins_cpp_trixie:
    <<: *cpp-agent
    build:
      <<: *cpp-agent-build
      context: ./agent_jenkins_cpp_trixie
    image: local/jenkins-agent-cpp:trixie
    container_name: agent_jenkins_cpp_trixie
    environment:
      <<: *cpp-agent-env
      JENKINS_AGENT_NAME: cpp-agent-trixie
      JENKINS_SECRET: "${CPP_TRIXIE_AGENT_SECRET}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cpp_agent_trixie_work:/home/jenkins/agent
      - cpp_agent_trixie_ccache:/home/jenkins/.ccache

  agent_jenkins_cpp_bullseye:
    <<: *cpp-agent
    build:
      <<: *cpp-agent-build
      context: ./agent_jenkins_cpp_bullseye
    image: local/jenkins-agent-cpp:bullseye
    container_name: agent_jenkins_cpp_bullseye
    environment:
      <<: *cpp-agent-env
      JENKINS_AGENT_NAME: cpp-agent-bullseye
      JENKINS_SECRET: "${CPP_BULLSEYE_AGENT_SECRET}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cpp_agent_bullseye_work:/home/jenkins/agent
      - cpp_agent_bullseye_ccache:/home/jenkins/.ccache

  agent_jenkins_cpp_stretch:
    <<: *cpp-agent
    build:
      <<: *cpp-agent-build
      context: ./agent_jenkins_cpp_stretch
    image: local/jenkins-agent-cpp:stretch
    container_name: agent_jenkins_cpp_stretch
    environment:
      <<: *cpp-agent-env
      JENKINS_AGENT_NAME: cpp-agent-stretch
      JENKINS_SECRET: "${CPP_STRETCH_AGENT_SECRET}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cpp_agent_stretch_work:/home/jenkins/agent
      - cpp_agent_stretch_ccache:/home/jenkins/.ccache

networks:
  ci_net:
    name: ci_net   # fixed name so runner job containers can join it
    driver: bridge

volumes:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  jenkins_home:
  gitlab_runner_config:
  gitlab_sonarqube_db:
  gitlab_sonarqube_data:
  gitlab_sonarqube_extensions:
  gitlab_sonarqube_logs:
  registry_data:
  cpp_agent_trixie_work:
  cpp_agent_trixie_ccache:
  cpp_agent_bullseye_work:
  cpp_agent_bullseye_ccache:
  cpp_agent_stretch_work:
  cpp_agent_stretch_ccache:
